<script>

const TYP_G=[{name:"身長",g:"tl",items:[{c:"typ201",l:"〜149cm"},{c:"typ202",l:"150〜154"},{c:"typ203",l:"155〜159"},{c:"typ204",l:"160〜164"},{c:"typ205",l:"165〜169"},{c:"typ206",l:"170cm〜"}]},{name:"年齢",g:"vi",items:[{c:"typ101",l:"18〜19歳"},{c:"typ102",l:"20〜24歳"},{c:"typ103",l:"25〜29歳"},{c:"typ104",l:"30〜34歳"},{c:"typ105",l:"35〜39歳"},{c:"typ106",l:"40〜44歳"},{c:"typ107",l:"45〜49歳"},{c:"typ108",l:"50歳〜"}]},{name:"カップ",g:"rs",items:[{c:"typ301",l:"A"},{c:"typ302",l:"B"},{c:"typ303",l:"C"},{c:"typ304",l:"D"},{c:"typ305",l:"E"},{c:"typ306",l:"F"},{c:"typ307",l:"G"},{c:"typ308",l:"H"},{c:"typ309",l:"I〜"}]},{name:"評判",g:"am",items:[{c:"typ01",l:"ルックス抜群"},{c:"typ02",l:"スタイル抜群"},{c:"typ03",l:"サービス抜群"},{c:"typ04",l:"感度抜群"},{c:"typ05",l:"素人"}]},{name:"体型",g:"pk",items:[{c:"typ06",l:"巨乳"},{c:"typ07",l:"スレンダー"},{c:"typ08",l:"ぷよっ子"},{c:"typ09",l:"小柄"},{c:"typ10",l:"長身"},{c:"typ11",l:"美乳"},{c:"typ12",l:"美脚"},{c:"typ22",l:"グラマー"},{c:"typ23",l:"ぽっちゃり"},{c:"typ55",l:"美尻"}]},{name:"ジャンル",g:"ind",items:[{c:"typ24",l:"ギャル系"},{c:"typ25",l:"モデル系"},{c:"typ26",l:"現役学生"},{c:"typ27",l:"セクシー女優"},{c:"typ28",l:"ハーフ"},{c:"typ30",l:"黒髪"}]},{name:"性格",g:"gn",items:[{c:"typ14",l:"明るい"},{c:"typ15",l:"癒し系"},{c:"typ34",l:"甘えん坊"},{c:"typ35",l:"天然"},{c:"typ36",l:"ツンデレ"},{c:"typ37",l:"おっとり"},{c:"typ39",l:"人懐っこい"},{c:"typ40",l:"エロい"},{c:"typ48",l:"話し好き"},{c:"typ49",l:"聞き上手"}]},{name:"プレイ",g:"or",items:[{c:"typ13",l:"パイパン"},{c:"typ16",l:"責め好き"},{c:"typ17",l:"受身好き"},{c:"typ44",l:"潮吹き"},{c:"typ45",l:"ドM"},{c:"typ46",l:"ドS"},{c:"typ51",l:"パイズリ"},{c:"typ54",l:"喫煙しない"}]}];
const TIMES=[{c:"",l:"指定なし"},{c:"0900",l:"9:00"},{c:"0930",l:"9:30"},{c:"1000",l:"10:00"},{c:"1030",l:"10:30"},{c:"1100",l:"11:00"},{c:"1130",l:"11:30"},{c:"1200",l:"12:00"},{c:"1230",l:"12:30"},{c:"1300",l:"13:00"},{c:"1330",l:"13:30"},{c:"1400",l:"14:00"},{c:"1430",l:"14:30"},{c:"1500",l:"15:00"},{c:"1530",l:"15:30"},{c:"1600",l:"16:00"},{c:"1630",l:"16:30"},{c:"1700",l:"17:00"},{c:"1730",l:"17:30"},{c:"1800",l:"18:00"},{c:"1830",l:"18:30"},{c:"1900",l:"19:00"},{c:"1930",l:"19:30"},{c:"2000",l:"20:00"},{c:"2030",l:"20:30"},{c:"2100",l:"21:00"},{c:"2130",l:"21:30"},{c:"2200",l:"22:00"},{c:"2230",l:"22:30"},{c:"2300",l:"23:00"},{c:"2330",l:"23:30"},{c:"0000",l:"0:00"},{c:"0030",l:"0:30"},{c:"0100",l:"1:00"},{c:"0130",l:"1:30"},{c:"0200",l:"2:00"},{c:"0230",l:"2:30"},{c:"0300",l:"3:00"}];
const SORTS=[{c:"",l:"標準"},{c:"review_sort",l:"口コミ数順"},{c:"ranking_sort_daily",l:"デイリーランキング"},{c:"mt",l:"100名店"},{c:"rc3",l:"スタッフ求人"}];
const DP=[{name:"デリヘル+エステ",lt:"girl-list",area:"tokyo",sub:"",biz:["biz6","biz7"],typ:["typ102","typ103","typ203","typ204","typ305","typ306","typ307"],time:"",reserve:true,sort:""},{name:"デリヘルお店",lt:"shop-list",area:"tokyo",sub:"",biz:["biz6"],typ:[],time:"",reserve:true,sort:""},{name:"ソープ吉原",lt:"shop-list",area:"tokyo",sub:"A1311",biz:["biz4"],typ:[],time:"",reserve:true,sort:""},{name:"ヘルス東京",lt:"girl-list",area:"tokyo",sub:"",biz:["biz1"],typ:[],time:"",reserve:true,sort:"review_sort"}];

// ═══ STATE ═══
let S={lt:"girl-list",area:"tokyo",sub:"",biz:["biz6","biz7"],typ:["typ102","typ103","typ203","typ204","typ305","typ306","typ307"],date:td(),time:"",reserve:true,sort:""};
let presets=ldP(),showPI=false;

function ldP(){try{let s=localStorage.getItem("ch_local_v1");if(s)return JSON.parse(s)}catch(e){}return DP.map(p=>({...p}))}
function svP(){try{localStorage.setItem("ch_local_v1",JSON.stringify(presets))}catch(e){}}
function td(){let d=new Date();return`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`}
function dOpts(){let o=[],n=new Date(),dn=["日","月","火","水","木","金","土"];for(let i=0;i<14;i++){let d=new Date(n);d.setDate(d.getDate()+i);o.push({c:`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`,l:`${d.getMonth()+1}/${d.getDate()}(${dn[d.getDay()]})`,w:d.getDay()})}return o}
function sc(a){return[...a].sort((x,y)=>parseInt(x.replace(/\D/g,""))-parseInt(y.replace(/\D/g,"")))}
function buildUrl(){
  let u=`https://www.cityheaven.net/${S.area}/`;
  if(S.sub)u+=`${S.sub}/`;u+=`${S.lt}/`;
  if(S.biz.length)u+=sc(S.biz).join("-")+"/";
  if(S.lt==="girl-list"&&S.typ.length)u+=sc(S.typ).join("-")+"/";
  if(S.date)u+=`date${S.date}/`;
  if(S.time){u+=`time${S.time}/`}
  else{if(S.reserve&&S.sort)u+=`reserve-${S.sort}/`;else if(S.reserve)u+="reserve/";else if(S.sort)u+=`${S.sort}/`}
  return u;
}

// ═══ RENDER ═══
function chip(l,act,key,val,active,cls,sm){return`<button class="c${active?' a '+cls:''}${sm?' sm':''}" data-a="${act}" data-k="${key}" data-v="${val}">${l}</button>`}
function R(){
  let dts=dOpts(),isG=S.lt==="girl-list";
  // Presets
  let h="";presets.forEach((p,i)=>{h+=`<div class="pr"><button class="c a pu" data-a="lp" data-v="${i}">${p.name}</button><button class="pr-del" data-a="dp" data-v="${i}">✕</button></div>`});
  h+=!showPI?`<button class="btn-add" data-a="tpi">＋ 保存</button>`:`<div class="pi-r"><input id="pi-inp" class="pi" placeholder="プリセット名"><button class="pi-ok" data-a="ap">OK</button><button class="pr-del" data-a="tpi">✕</button></div>`;
  document.getElementById("z-pr").innerHTML=h;
  if(showPI)setTimeout(()=>{let e=document.getElementById("pi-inp");if(e)e.focus()},0);
  // List type
  document.getElementById("z-lt").innerHTML=[["shop-list","お店で探す"],["girl-list","女の子で探す"]].map(([c,l])=>`<button class="tab${S.lt===c?' a':''}" data-a="set" data-k="lt" data-v="${c}">${l}</button>`).join("");
  // Prefecture
  let ph="";REGIONS.forEach(r=>{ph+=`<div class="rg"><div class="rg-t">${r.name}</div><div class="cg">`;r.items.forEach(a=>{ph+=chip(a.l,"set","area",a.c,S.area===a.c,"cy")});ph+=`</div></div>`});
  document.getElementById("z-pf").innerHTML=ph;
  // Sub areas
  let subs=SUBS[S.area]||[],se=document.getElementById("z-sa");
  se.innerHTML=subs.length?`<button class="cs${!S.sub?' a':''}" data-a="sub" data-v="">全域</button>`+subs.map(s=>`<button class="cs${S.sub===s.c?' a':''}" data-a="sub" data-v="${s.c}">${s.l}</button>`).join(""):`<span style="font-size:12px;color:#555">サブエリア未登録</span>`;
  // Biz
  document.getElementById("z-biz").innerHTML=BIZ.map(b=>chip(b.l,"tgl","biz",b.c,S.biz.includes(b.c),"or")).join("");
  let bn=document.getElementById("z-biz-n");bn.textContent=S.biz.length||"";bn.style.display=S.biz.length?"inline":"none";
  // Typ
  let ts=document.getElementById("z-typ-sec");
  if(isG){ts.style.display="";let th="";TYP_G.forEach(g=>{th+=`<div class="cg-lbl"><span class="cg-dot" style="background:var(--${g.g})"></span>${g.name}</div><div class="cg">`;g.items.forEach(t=>{th+=chip(t.l,"tgl","typ",t.c,S.typ.includes(t.c),g.g)});th+=`</div>`});
  document.getElementById("z-typ").innerHTML=th;let tn=document.getElementById("z-typ-n");tn.textContent=S.typ.length||"";tn.style.display=S.typ.length?"inline":"none"}
  else ts.style.display="none";
  // Date
  document.getElementById("z-dt").innerHTML=dts.map(d=>{let c=d.w===0?"rd":d.w===6?"bl":"pk";return chip(d.l,"set","date",d.c,S.date===d.c,c)}).join("");
  // Time
  document.getElementById("z-tm").innerHTML=TIMES.map(t=>chip(t.l,"set","time",t.c,S.time===t.c,t.c?"gn":"pk",true)).join("");
  document.getElementById("z-tm-note").textContent=S.time?"（※時間指定時はreserveは自動OFF）":"";
  // Sort
  document.getElementById("z-so").innerHTML=SORTS.map(s=>chip(s.l,"set","sort",s.c,S.sort===s.c,"am")).join("");
  // Options
  let resOn=S.reserve&&!S.time;
  document.getElementById("z-opt").innerHTML=`<button class="sw ${resOn?'on':'off'}" data-a="rsv" style="opacity:${S.time?.4:1};cursor:${S.time?'not-allowed':'pointer'}"></button><span class="tg-l">予約可能のみ（reserve）${S.time?" — 時間指定中は自動適用":""}</span>`;
  // URL
  let url=buildUrl();document.getElementById("z-url").textContent=url;document.getElementById("btn-go").href=url;
}

// ═══ EVENT DELEGATION ═══
document.addEventListener("click",function(e){
  let b=e.target.closest("[data-a]");if(!b)return;
  let a=b.dataset.a,k=b.dataset.k||"",v=b.dataset.v||"";
  switch(a){
    case"set":S[k]=v;if(k==="area")S.sub="";break;
    case"tgl":{let i=S[k].indexOf(v);if(i>=0)S[k].splice(i,1);else S[k].push(v);break}
    case"sub":S.sub=S.sub===v?"":v;break;
    case"rsv":if(!S.time)S.reserve=!S.reserve;break;
    case"lp":{let p=presets[+v];if(p){S.lt=p.lt||"girl-list";S.area=p.area;S.sub=p.sub||"";S.biz=[...p.biz];S.typ=[...(p.typ||[])];S.time=p.time||"";S.reserve=p.reserve!==undefined?p.reserve:true;S.sort=p.sort||""}break}
    case"dp":presets.splice(+v,1);svP();break;
    case"tpi":showPI=!showPI;break;
    case"ap":{let inp=document.getElementById("pi-inp"),nm=inp?inp.value.trim():"";if(!nm)return;presets.push({name:nm,lt:S.lt,area:S.area,sub:S.sub,biz:[...S.biz],typ:[...S.typ],time:S.time,reserve:S.reserve,sort:S.sort});svP();showPI=false;break}
    default:return;
  }
  R();
});
document.addEventListener("keydown",function(e){if(e.target.id==="pi-inp"){if(e.key==="Enter"){let inp=e.target,nm=inp.value.trim();if(!nm)return;presets.push({name:nm,lt:S.lt,area:S.area,sub:S.sub,biz:[...S.biz],typ:[...S.typ],time:S.time,reserve:S.reserve,sort:S.sort});svP();showPI=false;R()}if(e.key==="Escape"){showPI=false;R()}}});
document.getElementById("btn-cp").addEventListener("click",function(){
  navigator.clipboard.writeText(buildUrl()).then(()=>{let b=document.getElementById("btn-cp");b.textContent="✓ コピー済み";b.classList.add("ok");setTimeout(()=>{b.textContent="URLコピー";b.classList.remove("ok")},2000)});
});
document.getElementById("clr-biz").addEventListener("click",function(){S.biz=[];R()});
document.getElementById("clr-typ").addEventListener("click",function(){S.typ=[];R()});

document.head.insertAdjacentHTML("beforeend",`<style>:root{--pk:linear-gradient(135deg,#f06292,#e91e63);--cy:linear-gradient(135deg,#00bcd4,#0097a7);--or:linear-gradient(135deg,#ff7043,#e64a19);--pu:linear-gradient(135deg,#7c4dff,#536dfe);--rd:linear-gradient(135deg,#ef5350,#c62828);--bl:linear-gradient(135deg,#42a5f5,#1565c0);--am:linear-gradient(135deg,#ffb300,#ff8f00);--tl:linear-gradient(135deg,#26c6da,#00838f);--gn:linear-gradient(135deg,#66bb6a,#2e7d32);--vi:linear-gradient(135deg,#ab47bc,#7b1fa2);--rs:linear-gradient(135deg,#ec407a,#c2185b);--ind:linear-gradient(135deg,#5c6bc0,#283593)}</style>`);

R();
</script>
